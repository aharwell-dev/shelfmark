name: Shelfmark
options:
  bundleIdPrefix: edu.yale.yudw
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # set your Apple team ID here or in Xcode
targets:
  Shelfmark:
    type: application
    platform: iOS
    sources:
      - Shelfmark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.yale.yudw.shelfmark
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Shelfmark
        INFOPLIST_KEY_NSCameraUsageDescription: "Shelfmark photographs your bookshelves to read the spines and catalog your books."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Video capture of shelves may record audio; Shelfmark does not use it."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Shelfmark can catalog shelves from photos and videos already in your library."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
